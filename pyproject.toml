[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phish-triage"
version = "1.0.0"
description = "Offline-first phishing email triage for SOC analysts — header, authentication, URL, attachment and content analysis with a transparent, weighted verdict."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Muhammad Aun Bin Zulfiqar", email = "aunzulfiqar121@gmail.com" }]
keywords = ["phishing", "soc", "dfir", "email-security", "triage", "mitre-attack", "incident-response"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Topic :: Security",
]
dependencies = [
  "rich>=13.7",
  "jinja2>=3.1",
  "tldextract>=5.1",
]

[project.optional-dependencies]
dns = ["dnspython>=2.6"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[project.scripts]
phish-triage = "phishtriage.cli:main"

[project.urls]
Homepage = "https://github.com/AunZulfiqar/phish-triage"
Issues = "https://github.com/AunZulfiqar/phish-triage/issues"

[tool.setuptools.packages.find]
include = ["phishtriage*"]

[tool.setuptools.package-data]
"phishtriage.reporting" = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The sample corpus embeds realistic HTML bodies; wrapping them would change the
# fixtures the detection tests assert against.
"samples/generate.py" = ["E501"]

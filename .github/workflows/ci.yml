name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest --cov=phishtriage --cov-report=term-missing

      # The sample corpus is committed. If regenerating it produces different
      # bytes, the committed samples are stale and the documented verdicts in
      # the README can no longer be trusted.
      - name: Sample corpus is reproducible
        shell: bash
        run: |
          python samples/generate.py
          git diff --exit-code -- samples/

      # docs/ is generated from the catalogue and the sample corpus. If
      # regenerating changes anything, the committed reference disagrees with
      # what the code actually does -- which is the one thing a detection
      # reference must never do.
      - name: Generated docs are current
        shell: bash
        run: |
          python tools/gendocs.py
          git diff --exit-code -- docs/

      - name: Web app smoke test
        shell: bash
        run: |
          python - <<'EOF'
          from webapp import Config, create_app
          app = create_app(Config(secret_key="ci"))
          client = app.test_client()
          assert client.get("/healthz").get_json()["status"] == "ok"
          page = client.get("/").get_data(as_text=True)
          token = page.split('name="csrf_token" value="')[1].split('"')[0]
          with open("samples/credential-phish.eml", "rb") as fh:
              body = fh.read()
          import io
          r = client.post("/analyze", data={
              "csrf_token": token,
              "messages": (io.BytesIO(body), "credential-phish.eml"),
          }, content_type="multipart/form-data")
          assert r.status_code == 303, r.status_code
          report = client.get(r.headers["Location"]).get_data(as_text=True)
          assert "Malicious" in report
          # The CSP must never be relaxed to allow inline styles or scripts.
          csp = client.get("/").headers["Content-Security-Policy"]
          assert "unsafe-inline" not in csp and "unsafe-eval" not in csp
          print("web app ok")
          EOF

      - name: CLI smoke test
        shell: bash
        run: |
          phish-triage --version
          phish-triage indicators --format json > /dev/null
          phish-triage analyze samples/ --format summary --fail-on never > /dev/null
          phish-triage analyze samples/credential-phish.eml --format html -o /tmp/r.html
          test -s /tmp/r.html
